name: Windows build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['**.md', 'doc/**', '.github/ISSUE_TEMPLATE.md']
  pull_request:
    paths-ignore: ['**.md', 'doc/**', '.github/ISSUE_TEMPLATE.md']
  workflow_dispatch:
    inputs:
      cuda_version:
        description: CUDA Toolkit version (12.x; CUDA 13 dropped sm_50-sm_70, which CMakeLists.txt still targets)
        default: '12.9.1'
      cuda_samples_ref:
        description: NVIDIA/cuda-samples tag providing helper_math.h
        default: 'v12.9'
      build_type:
        description: CMake build type
        type: choice
        options: [Release, RelWithDebInfo, Debug]
        default: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CUDA_VERSION: ${{ inputs.cuda_version || '12.9.1' }}
  CUDA_SAMPLES_REF: ${{ inputs.cuda_samples_ref || 'v12.9' }}
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  DEPS_DIR: ${{ github.workspace }}\deps-win

jobs:
  build:
    name: Windows x64 (${{ matrix.variant }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            cuda: false
          - variant: cuda
            cuda: true

    steps:
      - uses: actions/checkout@v7

      - name: Cache prebuilt dependencies
        uses: actions/cache@v6
        with:
          path: deps-win
          key: win64-deps-${{ hashFiles('.github/scripts/fetch-windows-deps.ps1') }}

      - name: Fetch libusb, libjpeg-turbo, GLFW, OpenCL SDK
        shell: pwsh
        run: ./.github/scripts/fetch-windows-deps.ps1 -DestDir $env:DEPS_DIR

      - name: Install CUDA Toolkit ${{ env.CUDA_VERSION }}
        if: matrix.cuda
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart"]'

      # helper_math.h is no longer shipped with the toolkit; CMakeLists.txt looks
      # for it in depends/cuda-samples/Common.
      - name: Fetch cuda-samples helpers
        if: matrix.cuda
        uses: actions/checkout@v7
        with:
          repository: NVIDIA/cuda-samples
          ref: ${{ env.CUDA_SAMPLES_REF }}
          path: depends/cuda-samples
          sparse-checkout: Common
          sparse-checkout-cone-mode: true

      # Exports the VS developer environment (cl, link, Windows SDK) to later
      # steps. Runs after the CUDA install so its PATH entries are kept.
      - name: Set up MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the C++ toolset found' }
          Write-Host "Using Visual Studio at $vs"
          function Read-Env([string] $cmd) {
            $vars = @{}
            cmd /c "$cmd set" | ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { $vars[$Matches[1]] = $Matches[2] } }
            $vars
          }
          $before = Read-Env ''
          $after = Read-Env "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo &&"
          foreach ($name in $after.Keys) {
            if ($name -eq 'Path') {
              # GITHUB_PATH prepends each line, so write in reverse to keep VsDevCmd's order.
              $old = $before['Path'] -split ';'
              $new = @($after['Path'] -split ';' | Where-Object { $_ -and $_ -notin $old })
              [array]::Reverse($new)
              $new | Out-File $env:GITHUB_PATH -Append -Encoding utf8
            } elseif ($before[$name] -ne $after[$name]) {
              "$name=$($after[$name])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Configure
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          $cuda = if ('${{ matrix.cuda }}' -eq 'true') { 'ON' } else { 'OFF' }
          # cl is forced explicitly: the runner's PATH also contains MinGW gcc (Strawberry Perl).
          cmake -S . -B build -G Ninja `
            -C "$env:DEPS_DIR/deps.cmake" `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            -DENABLE_CUDA="$cuda" `
            -DENABLE_OPENCL=ON `
            -DENABLE_OPENGL=ON `
            -DENABLE_VAAPI=OFF `
            -DENABLE_TEGRAJPEG=OFF `
            -DBUILD_OPENNI2_DRIVER=OFF `
            -DBUILD_EXAMPLES=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The CMake scripts silently fall back to "disabled" when a feature's
      # dependency is not found; fail loudly instead.
      - name: Verify enabled features
        shell: pwsh
        run: |
          $config = Get-Content build/libfreenect2/config.h -Raw
          $required = @('TURBOJPEG', 'OPENGL', 'OPENCL')
          if ('${{ matrix.cuda }}' -eq 'true') { $required += 'CUDA' }
          $missing = $required | Where-Object { $config -notmatch "#define LIBFREENECT2_WITH_$($_)_SUPPORT" }
          if ($missing) { throw "Features not enabled: $($missing -join ', ')" }
          Write-Host "Enabled: $($required -join ', ')"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      - name: Assemble package
        shell: pwsh
        run: |
          $install = '${{ github.workspace }}/install'
          # Matches the upstream binary release layout (depends/make_release_msvc.cmd).
          Remove-Item -Recurse -Force "$install/lib/cmake", "$install/lib/pkgconfig" -ErrorAction SilentlyContinue
          Copy-Item depends/LICENSES.txt, depends/INSTALL-windows.txt, CONTRIB, APACHE20, GPL2 $install
          if ('${{ matrix.cuda }}' -eq 'true') {
            # freenect2.dll links the shared CUDA runtime; it is redistributable per the CUDA EULA.
            $cudart = Get-ChildItem "$env:CUDA_PATH/bin" -Filter 'cudart64_*.dll' | Select-Object -First 1
            if (-not $cudart) { throw "cudart64_*.dll not found in $env:CUDA_PATH/bin" }
            Copy-Item $cudart.FullName "$install/bin"
          }
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "g$('${{ github.sha }}'.Substring(0, 7))" }
          $variant = if ('${{ matrix.cuda }}' -eq 'true') { "cuda$($env:CUDA_VERSION -replace '^(\d+\.\d+).*', '$1')" } else { 'cpu' }
          "PACKAGE_NAME=libfreenect2-$version-win64-$variant" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -Recurse $install | Select-Object -ExpandProperty FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: install/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Zip packages
        working-directory: packages
        run: for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" packages/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
